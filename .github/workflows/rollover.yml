name: Rollover alert

# Sends the "market rollover in 1 minute" notification at exactly 10:59 pm UK, Sunday–Thursday.
# GitHub's scheduler can start jobs late, so this wakes ~40 minutes early and waits for 10:59.
# Two start times cover UK summer time (BST) and winter time (GMT); the one that doesn't match exits.
on:
  schedule:
    - cron: "20 21 * * 0-4"   # 10:20 pm BST
    - cron: "20 22 * * 0-4"   # 10:20 pm GMT
  workflow_dispatch:

concurrency:
  group: rollover
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Wait until 10:59 pm UK, then call the site
        env:
          URL: ${{ secrets.PUSH_CRON_URL }}
          KEY: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "::warning::Add the PUSH_CRON_URL and CRON_SECRET secrets."; exit 0; fi
          target=$(TZ=Europe/London date -d "today 22:59:05" +%s)
          now=$(date +%s); wait=$((target - now))
          echo "Seconds until 10:59 pm UK: $wait"
          if [ "$wait" -lt -60 ] || [ "$wait" -gt 5400 ]; then echo "Not this run's slot (other time zone or too late)."; exit 0; fi
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          code=$(curl -sS -o out.json -w "%{http_code}" -H "Authorization: Bearer $KEY" "$URL" || echo 000)
          echo "HTTP $code"; cat out.json; echo
          if [ "$code" != "200" ]; then echo "::error::The site answered HTTP $code: $(head -c 300 out.json)"; exit 1; fi
