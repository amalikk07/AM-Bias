name: Live quotes

on:
  schedule:
    # Every 15 minutes, weekdays, 12:00–20:59 UTC (about 7 a.m.–4 p.m. New York time)
    - cron: "*/15 12-20 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/fetch_quotes.py", ".github/workflows/quotes.yml"]

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Fetch quotes from FMP
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python3 scripts/fetch_quotes.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- quotes.json; then echo "Nothing to commit"; exit 0; fi
          git config user.name "am-bias-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes.json
          git commit -m "Update live quotes"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
